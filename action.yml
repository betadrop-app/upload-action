# betadrop-app/upload-action — publish an .ipa/.apk from CI and get the OTA install link.
#
# A composite action rather than a JS action, deliberately. The heavy lifting already exists as
# the published CLI (@betadrop/cli), so a JS action would mean maintaining a second upload client
# plus a checked-in dist/ bundle. Composite keeps this repo to one YAML file that shells out to
# the same tool a developer uses locally — one client to maintain, and CI behaves exactly like
# the laptop. Node is preinstalled on every GitHub-hosted runner image, so `npm i -g` needs no
# setup step.
name: "BetaDrop Upload"
# GitHub Marketplace rejects a description of 125 characters or more, and this string is also the
# one-line blurb shown in Marketplace search results — so it has to carry both platforms and the
# hook inside that budget. The longer pitch lives in README.md, which the listing renders in full.
description: "Upload an iOS .ipa or Android .apk from CI and get an instant over-the-air install link. No TestFlight wait."
author: "BetaDrop"

branding:
  icon: "upload-cloud"
  color: "blue"

inputs:
  file:
    description: >-
      Path to the build artifact (.ipa or .apk). A glob is allowed — e.g.
      app/build/outputs/apk/release/*.apk — and must match exactly one file.
    required: true
  token:
    description: >-
      A BetaDrop API token (bd_live_…). Create one at betadrop.app under
      Settings → Developer → API tokens, and store it as a repository secret — never inline
      it in the workflow.
    required: true
  name:
    description: "Override the build name shown on the install page (defaults to the app's own name)."
    required: false
    default: ""
  notes:
    description: "Release notes for this build — e.g. the commit message."
    required: false
    default: ""
  channel:
    description: >-
      A channel slug to point at this build once it is live — e.g. nightly. The channel's link
      (and any "Download from BetaDrop" button embedded with it) then serves this build with
      nothing to click. Pro and Studio plans; claim the channel first at betadrop.app/channels.
      A channel that cannot be used fails the step before anything is uploaded. Requires
      @betadrop/cli 0.3.0 or newer — the step checks the installed CLI and says so by name if
      the version it resolved is too old.
    required: false
    default: ""
  cli-version:
    description: "Version of @betadrop/cli to use. Pin this for reproducible pipelines."
    required: false
    default: "latest"

outputs:
  install-url:
    description: "The OTA install link for the uploaded build."
    value: ${{ steps.publish.outputs.install-url }}
  channel-url:
    description: "The channel's stable install link, when `channel` was set. Empty otherwise."
    value: ${{ steps.publish.outputs.channel-url }}

runs:
  using: "composite"
  steps:
    - name: Install BetaDrop CLI
      shell: bash
      env:
        CLI_VERSION: ${{ inputs.cli-version }}
      run: |
        set -euo pipefail
        # `default:` only fills in an *omitted* input. `cli-version: ""` — which is what
        # `cli-version: ${{ env.SOMETHING_UNSET }}` evaluates to — arrives as an empty string
        # and would build the spec "@betadrop/cli@", so re-apply the default here.
        version="${CLI_VERSION:-latest}"
        npm install -g --no-fund --no-audit "@betadrop/cli@${version}"
        # npm can install successfully into a global prefix that is not on PATH (it happens on
        # self-hosted runners and on images with a user-level npm prefix). Catch it here, where
        # the cause is still obvious, rather than as "betadrop: command not found" mid-publish.
        if ! command -v betadrop >/dev/null 2>&1; then
          echo "::error::@betadrop/cli installed but 'betadrop' is not on PATH. npm's global prefix is $(npm prefix -g 2>/dev/null || echo unknown) — add its bin directory to PATH before this step."
          exit 1
        fi
        echo "Using @betadrop/cli $(betadrop --version 2>/dev/null || echo '(version unknown)')"

    - name: Publish build
      id: publish
      shell: bash
      # Inputs are passed through env, not interpolated into the script. `${{ inputs.file }}`
      # spliced directly into `run:` would let a filename (or a workflow expression) inject shell —
      # the standard composite-action footgun.
      env:
        BETADROP_TOKEN: ${{ inputs.token }}
        INPUT_FILE: ${{ inputs.file }}
        INPUT_NAME: ${{ inputs.name }}
        INPUT_NOTES: ${{ inputs.notes }}
        INPUT_CHANNEL: ${{ inputs.channel }}
        # Carried into this step so the diagnostics below can name the version that was actually
        # requested. Without it every "your CLI is too old" message read "cli-version: latest",
        # which is exactly the wrong advice for someone who pinned an old one.
        CLI_VERSION: ${{ inputs.cli-version }}
      run: |
        set -euo pipefail

        # A token passed as `${{ secrets.X }}` is masked by the runner already. One pasted
        # literally — or read out of a file by a previous step — is not, and would print in
        # clear if any command here ever echoed it. Registering the mask costs one line.
        if [ -n "${BETADROP_TOKEN:-}" ]; then
          echo "::add-mask::$BETADROP_TOKEN"
        else
          echo "::error::No token supplied. Create one at betadrop.app under Settings → Developer → API tokens and pass it as token: \${{ secrets.BETADROP_TOKEN }}."
          exit 1
        fi

        # A channel slug is [a-z0-9._-] by construction. Validating it here fails a typo in the
        # workflow before an upload rather than after one, and — because the slug is echoed into
        # the job summary further down as Markdown — it also keeps a value like a backtick or an
        # <img> tag out of a page rendered on github.com.
        if [ -n "$INPUT_CHANNEL" ]; then
          case "$INPUT_CHANNEL" in
            *[!a-zA-Z0-9._-]*)
              echo "::error::channel '$INPUT_CHANNEL' is not a valid slug — letters, digits, dots, dashes and underscores only."
              exit 1
              ;;
          esac

          # `--channel` landed in @betadrop/cli 0.3.0. Older CLIs reject it with commander's
          # "unknown option '--channel'", which tells the reader nothing about which version they
          # have or which one they need — and `cli-version: latest` resolves to whatever npm's
          # latest tag currently points at, which may still predate the flag. Ask the CLI what it
          # supports and fail with the two facts that actually resolve this.
          #
          # Captured rather than piped into grep: `grep -q` closes the pipe on its first match,
          # and under `pipefail` that SIGPIPE would be read as "the flag is missing".
          cli_help="$(betadrop publish --help 2>&1 || true)"
          case "$cli_help" in
            *--channel*) ;;
            *)
              echo "::error::channel was set, but the installed @betadrop/cli ($(betadrop --version 2>/dev/null || echo 'version unknown')) has no --channel flag — it needs 0.3.0 or newer. Requested cli-version: ${CLI_VERSION:-latest}."
              exit 1
              ;;
          esac
        fi

        # A path arriving from a YAML block scalar or from `${{ steps.build.outputs.path }}`
        # routinely carries a trailing newline. Unaddressed it becomes part of the pattern, the
        # glob matches nothing, and the run reports a missing build that is sitting right there.
        INPUT_FILE="$(printf '%s' "$INPUT_FILE" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
        if [ -z "$INPUT_FILE" ]; then
          echo "::error::file is empty. Point it at the .ipa/.apk your build step produced."
          exit 1
        fi

        # Resolve the glob to exactly one file. Build outputs often carry hashed or versioned
        # names, so a literal-path-only input would push everyone into a find/ls preamble; but
        # silently taking the first of several matches would upload an arbitrary build, which is
        # worse than failing. One match or an actionable error.
        # Emptying IFS disables word splitting while leaving pathname expansion intact, so
        # "build/My App.ipa" stays one word instead of splitting into two bogus "matches" —
        # Xcode output paths routinely contain spaces. A glob still fans out to one array
        # element per file, because glob results are never word-split.
        prev_ifs=$IFS
        IFS=
        shopt -s nullglob
        matches=( $INPUT_FILE )
        shopt -u nullglob
        IFS=$prev_ifs

        # nullglob drops a *pattern* that matches nothing, but a literal path is not a pattern
        # and survives even when the file is absent. Filter to what actually exists so a typo
        # lands on the "no file matches" error below rather than on a confusing upload failure.
        # `-f`, not `-e`: a pattern that resolves to a directory (say `outputs/*`) is not a build,
        # and letting it through only moves the failure to the upload.
        present=()
        for m in ${matches[@]+"${matches[@]}"}; do
          [ -f "$m" ] && present+=( "$m" )
        done
        matches=( ${present[@]+"${present[@]}"} )

        if [ "${#matches[@]}" -eq 0 ]; then
          echo "::error::No file matches '$INPUT_FILE'. Check the path — is the build step before this one, and did it write where you expect?"
          exit 1
        fi
        if [ "${#matches[@]}" -gt 1 ]; then
          echo "::error::'$INPUT_FILE' matches ${#matches[@]} files (${matches[*]}). Narrow the glob so exactly one build is published."
          exit 1
        fi
        file="${matches[0]}"
        echo "Publishing $file"

        # --ci prints the install URL as the *last* line of stdout, which is exactly what an
        # output wants. Take the last line rather than the whole capture: the CLI's contract is
        # "last line", so any future warning printed ahead of it would otherwise become part of
        # the URL — and a multi-line GITHUB_OUTPUT value is both broken and injectable. The
        # optional flags are appended as an array — quoting survives spaces in a commit message.
        args=( publish "$file" --ci )
        [ -n "$INPUT_NAME" ] && args+=( --name "$INPUT_NAME" )
        [ -n "$INPUT_NOTES" ] && args+=( --notes "$INPUT_NOTES" )
        [ -n "$INPUT_CHANNEL" ] && args+=( --channel "$INPUT_CHANNEL" )

        # Captured *and* echoed. A plain `out="$(betadrop …)"` swallows stdout, and the CLI has
        # one path where that loses something the user needs: a publish that uploaded fine but
        # whose channel did not move prints the install URL and *then* exits non-zero. Swallowed,
        # that run ends red with a live build at a link nobody can read. `tee` keeps the log
        # honest; the file keeps the capture. PIPESTATUS is read here at the top level, because
        # inside `$( … )` it would describe the assignment rather than the CLI.
        # mktemp, not $RUNNER_TEMP: on a Windows runner RUNNER_TEMP is a backslashed Windows
        # path (D:\a\_temp), which bash on that image does not reliably resolve.
        log="$(mktemp 2>/dev/null || echo "${TMPDIR:-/tmp}/betadrop-publish.$$.log")"
        set +e
        betadrop "${args[@]}" | tee "$log"
        status=${PIPESTATUS[0]}
        set -e
        if [ "$status" -ne 0 ]; then
          echo "::error::betadrop publish failed (exit $status). The CLI's own message is above."
          exit "$status"
        fi
        out="$(cat "$log")"

        # The CLI's contract is that the install URL is the LAST line of stdout, and that with
        # --channel the line above it is `channel-url=<link>`.
        url="$(printf '%s\n' "$out" | tail -n 1)"
        channel_url="$(printf '%s\n' "$out" | grep -m1 '^channel-url=' | cut -d= -f2- || true)"
        if [ -z "$url" ]; then
          echo "::error::Publish produced no output, so there is no install URL to report."
          exit 1
        fi
        # The "last line" contract is the CLI's to keep, and it keeps it by routing every warning
        # to stderr. Verify anyway: the failure mode if it ever slips is silent and permanent —
        # a warning published as this run's install-url, linked from the summary, and pasted into
        # a PR comment by the next step.
        case "$url" in
          https://*) ;;
          *)
            echo "::error::Publish did not end with an install URL — the last line of output was: $url"
            exit 1
            ;;
        esac
        if [ -n "$INPUT_CHANNEL" ] && [ -z "$channel_url" ]; then
          echo "::error::A channel was requested but the CLI reported no channel link. Installed @betadrop/cli: $(betadrop --version 2>/dev/null || echo 'version unknown'); requested cli-version: ${CLI_VERSION:-latest}."
          exit 1
        fi

        echo "install-url=$url" >> "$GITHUB_OUTPUT"
        echo "channel-url=$channel_url" >> "$GITHUB_OUTPUT"

        # The human-facing copy of the same fact: a tester-ready link on the run page itself,
        # so nobody digs through step logs to find it.
        #
        # This panel is the only place BetaDrop appears in front of an audience it did not have
        # to acquire — it renders on the run page of every green build, for the whole team, not
        # just whoever triggered it. So it carries the mark rather than an emoji: job summaries
        # render a subset of HTML, and an <img> at an absolute URL is the one way to get real
        # brand into a surface hosted entirely on github.com.
        #
        # Kept deliberately small. A summary that shouts is a summary teams delete from their
        # workflow, and the link is the only thing anyone is here for.
        {
          echo "<img src=\"https://betadrop.app/logo.png\" width=\"28\" align=\"left\" alt=\"BetaDrop\">"
          echo ""
          echo "### Build published to BetaDrop"
          echo ""
          echo "**[Install on a device]($url)** · \`$url\`"
          echo ""
          if [ -n "$channel_url" ]; then
            # The channel link leads for the reader who bookmarks: it is the one that will still
            # point at the newest build next week, which the per-build link above will not.
            echo "Channel \`$INPUT_CHANNEL\` now serves this build — the stable link is **[$channel_url]($channel_url)**."
            echo ""
          fi
          echo "Open it on a phone to install over the air — no TestFlight, no tester accounts."
        } >> "$GITHUB_STEP_SUMMARY"

        echo "Install link: $url"
        # `if`, not `[ ] &&`: this is the last command in the step, so a bare test that is false
        # would become the step's exit status and fail every run that did not ask for a channel.
        if [ -n "$channel_url" ]; then
          echo "Channel link: $channel_url"
        fi
