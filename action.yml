# betadrop-app/upload-action — publish an .ipa/.apk from CI and get the OTA install link.
#
# A composite action rather than a JS action, deliberately. The heavy lifting already exists as
# the published CLI (@betadrop/cli), so a JS action would mean maintaining a second upload client
# plus a checked-in dist/ bundle. Composite keeps this repo to one YAML file that shells out to
# the same tool a developer uses locally — one client to maintain, and CI behaves exactly like
# the laptop. Node is preinstalled on every GitHub-hosted runner image, so `npm i -g` needs no
# setup step.
name: "BetaDrop Upload"
# GitHub Marketplace rejects a description of 125 characters or more, and this string is also the
# one-line blurb shown in Marketplace search results — so it has to carry both platforms and the
# hook inside that budget. The longer pitch lives in README.md, which the listing renders in full.
description: "Upload an iOS .ipa or Android .apk from CI and get an instant over-the-air install link. No TestFlight wait."
author: "BetaDrop"

branding:
  icon: "upload-cloud"
  color: "blue"

inputs:
  file:
    description: >-
      Path to the build artifact (.ipa or .apk). A glob is allowed — e.g.
      app/build/outputs/apk/release/*.apk — and must match exactly one file.
    required: true
  token:
    description: >-
      A BetaDrop API token (bd_live_…). Create one at betadrop.app under
      Settings → Developer → API tokens, and store it as a repository secret — never inline
      it in the workflow.
    required: true
  name:
    description: "Override the build name shown on the install page (defaults to the app's own name)."
    required: false
    default: ""
  notes:
    description: "Release notes for this build — e.g. the commit message."
    required: false
    default: ""
  channel:
    description: >-
      A channel slug to point at this build once it is live — e.g. nightly. The channel's link
      (and any "Download from BetaDrop" button embedded with it) then serves this build with
      nothing to click. Pro and Studio plans; claim the channel first at betadrop.app/channels.
      A channel that cannot be used fails the step before anything is uploaded. Needs
      @betadrop/cli 0.3.0 or newer.
    required: false
    default: ""
  cli-version:
    description: "Version of @betadrop/cli to use. Pin this for reproducible pipelines."
    required: false
    default: "latest"

outputs:
  install-url:
    description: "The OTA install link for the uploaded build."
    value: ${{ steps.publish.outputs.install-url }}
  channel-url:
    description: "The channel's stable install link, when `channel` was set. Empty otherwise."
    value: ${{ steps.publish.outputs.channel-url }}

runs:
  using: "composite"
  steps:
    - name: Install BetaDrop CLI
      shell: bash
      env:
        CLI_VERSION: ${{ inputs.cli-version }}
      run: npm install -g "@betadrop/cli@${CLI_VERSION}"

    - name: Publish build
      id: publish
      shell: bash
      # Inputs are passed through env, not interpolated into the script. `${{ inputs.file }}`
      # spliced directly into `run:` would let a filename (or a workflow expression) inject shell —
      # the standard composite-action footgun.
      env:
        BETADROP_TOKEN: ${{ inputs.token }}
        INPUT_FILE: ${{ inputs.file }}
        INPUT_NAME: ${{ inputs.name }}
        INPUT_NOTES: ${{ inputs.notes }}
        INPUT_CHANNEL: ${{ inputs.channel }}
      run: |
        set -euo pipefail

        # Resolve the glob to exactly one file. Build outputs often carry hashed or versioned
        # names, so a literal-path-only input would push everyone into a find/ls preamble; but
        # silently taking the first of several matches would upload an arbitrary build, which is
        # worse than failing. One match or an actionable error.
        # Emptying IFS disables word splitting while leaving pathname expansion intact, so
        # "build/My App.ipa" stays one word instead of splitting into two bogus "matches" —
        # Xcode output paths routinely contain spaces. A glob still fans out to one array
        # element per file, because glob results are never word-split.
        prev_ifs=$IFS
        IFS=
        shopt -s nullglob
        matches=( $INPUT_FILE )
        shopt -u nullglob
        IFS=$prev_ifs

        # nullglob drops a *pattern* that matches nothing, but a literal path is not a pattern
        # and survives even when the file is absent. Filter to what actually exists so a typo
        # lands on the "no file matches" error below rather than on a confusing upload failure.
        present=()
        for m in ${matches[@]+"${matches[@]}"}; do
          [ -e "$m" ] && present+=( "$m" )
        done
        matches=( ${present[@]+"${present[@]}"} )

        if [ "${#matches[@]}" -eq 0 ]; then
          echo "::error::No file matches '$INPUT_FILE'. Check the path — is the build step before this one, and did it write where you expect?"
          exit 1
        fi
        if [ "${#matches[@]}" -gt 1 ]; then
          echo "::error::'$INPUT_FILE' matches ${#matches[@]} files (${matches[*]}). Narrow the glob so exactly one build is published."
          exit 1
        fi
        file="${matches[0]}"
        echo "Publishing $file"

        # --ci prints the install URL as the *last* line of stdout, which is exactly what an
        # output wants. Take the last line rather than the whole capture: the CLI's contract is
        # "last line", so any future warning printed ahead of it would otherwise become part of
        # the URL — and a multi-line GITHUB_OUTPUT value is both broken and injectable. The
        # optional flags are appended as an array — quoting survives spaces in a commit message.
        args=( publish "$file" --ci )
        [ -n "$INPUT_NAME" ] && args+=( --name "$INPUT_NAME" )
        [ -n "$INPUT_NOTES" ] && args+=( --notes "$INPUT_NOTES" )
        [ -n "$INPUT_CHANNEL" ] && args+=( --channel "$INPUT_CHANNEL" )
        # The whole of stdout is captured, then split: the CLI's contract is that the install
        # URL is the LAST line, and that with --channel the line above it is
        # `channel-url=<link>`. A non-zero exit from the CLI — including "uploaded, but the
        # channel did not move" — fails this step here, before any output is written.
        out="$(betadrop "${args[@]}")"
        url="$(printf '%s\n' "$out" | tail -n 1)"
        channel_url="$(printf '%s\n' "$out" | grep -m1 '^channel-url=' | cut -d= -f2- || true)"
        if [ -z "$url" ]; then
          echo "::error::Publish produced no install URL."
          exit 1
        fi
        if [ -n "$INPUT_CHANNEL" ] && [ -z "$channel_url" ]; then
          echo "::error::A channel was requested but the CLI reported no channel link. Is @betadrop/cli 0.3.0 or newer installed? (cli-version: ${CLI_VERSION:-latest})"
          exit 1
        fi

        echo "install-url=$url" >> "$GITHUB_OUTPUT"
        echo "channel-url=$channel_url" >> "$GITHUB_OUTPUT"

        # The human-facing copy of the same fact: a tester-ready link on the run page itself,
        # so nobody digs through step logs to find it.
        #
        # This panel is the only place BetaDrop appears in front of an audience it did not have
        # to acquire — it renders on the run page of every green build, for the whole team, not
        # just whoever triggered it. So it carries the mark rather than an emoji: job summaries
        # render a subset of HTML, and an <img> at an absolute URL is the one way to get real
        # brand into a surface hosted entirely on github.com.
        #
        # Kept deliberately small. A summary that shouts is a summary teams delete from their
        # workflow, and the link is the only thing anyone is here for.
        {
          echo "<img src=\"https://betadrop.app/logo.png\" width=\"28\" align=\"left\" alt=\"BetaDrop\">"
          echo ""
          echo "### Build published to BetaDrop"
          echo ""
          echo "**[Install on a device]($url)** · \`$url\`"
          echo ""
          if [ -n "$channel_url" ]; then
            # The channel link leads for the reader who bookmarks: it is the one that will still
            # point at the newest build next week, which the per-build link above will not.
            echo "Channel \`$INPUT_CHANNEL\` now serves this build — the stable link is **[$channel_url]($channel_url)**."
            echo ""
          fi
          echo "Open it on a phone to install over the air — no TestFlight, no tester accounts."
        } >> "$GITHUB_STEP_SUMMARY"

        echo "Install link: $url"
        # `if`, not `[ ] &&`: this is the last command in the step, so a bare test that is false
        # would become the step's exit status and fail every run that did not ask for a channel.
        if [ -n "$channel_url" ]; then
          echo "Channel link: $channel_url"
        fi
